<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Navy background -->
  <rect width="32" height="32" rx="6" fill="#2c3e6b"/>
  <!-- 3x3 bingo grid of cells -->
  <!-- Row 1 -->
  <rect x="4"  y="4"  width="7" height="7" rx="1.5" fill="white" opacity="0.9"/>
  <rect x="13" y="4"  width="7" height="7" rx="1.5" fill="white" opacity="0.9"/>
  <rect x="22" y="4"  width="7" height="7" rx="1.5" fill="white" opacity="0.9"/>
  <!-- Row 2 -->
  <rect x="4"  y="13" width="7" height="7" rx="1.5" fill="white" opacity="0.9"/>
  <!-- Center cell - orange (marked) -->
  <rect x="13" y="13" width="7" height="7" rx="1.5" fill="#e05c2a"/>
  <!-- Center checkmark dot -->
  <circle cx="16.5" cy="16.5" r="2" fill="white"/>
  <rect x="22" y="13" width="7" height="7" rx="1.5" fill="white" opacity="0.9"/>
  <!-- Row 3 -->
  <rect x="4"  y="22" width="7" height="7" rx="1.5" fill="white" opacity="0.9"/>
  <rect x="13" y="22" width="7" height="7" rx="1.5" fill="white" opacity="0.9"/>
  <rect x="22" y="22" width="7" height="7" rx="1.5" fill="white" opacity="0.9"/>
</svg>
