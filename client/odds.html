<!doctype html>
<html lang="en" style="background-color: #496542;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steve Graf - Odds</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Dave's Odds" />
    <meta property="og:description" content="A simple odds tracker to preview game lines." />
    <!-- <meta property="og:image" content="https://stevegraf.com/preview.jpg" /> -->
    <meta property="og:url" content="https://stevegraf.com/odds" />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/odds/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/odds/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#619e51" />
    <!-- fonts the first screen needs: start fetching them with the page instead of after the JS builds the DOM -->
    <link rel="preload" href="/odds_src/assets/fonts/nfl-browns-2015.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/odds_src/assets/fonts/BarlowCondensed-ExtraBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/odds_src/assets/fonts/Barlow-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/odds_src/assets/fonts/Arimo-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/odds_src/assets/fonts/Arimo-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dave's Odds" />
    <style>
      #root{
        width: 80%;
        max-width: 700px;
        margin: 0 auto;
        background-color:#eee0d3;
        box-shadow: 0 0 30px rgb(0 0 0 / 0.35);
        border: 10px solid #ffffff;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body style="margin:10px auto 50px auto;background-color:#496542">
    <div id="root"></div>

    <div id="ios-install-banner" class="ios-install-banner" hidden>
      <img class="ios-install-banner-icon" src="/odds/icons/icon-192.png" alt="" />
      <p class="ios-install-banner-text">
        Install Dave's Odds: tap
        <span class="ios-install-banner-share-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12" />
            <path d="M8 7l4-4 4 4" />
            <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
          </svg>
        </span>
        then "Add to Home Screen"
      </p>
      <button type="button" class="ios-install-banner-dismiss" aria-label="Dismiss">&times;</button>
    </div>
  </body>
  <script type="module" src="/odds_src/main.jsx"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/odds/sw.js", { scope: "/odds/" });
    }
  </script>
</html>
