<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dave's Odds — Admin</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      background: #2e1f01;
      color: #eee0d3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-card {
      background: #eee0d3;
      color: #2e1f01;
      padding: 30px;
      border-radius: 10px;
      width: 280px;
      box-sizing: border-box;
      box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.4);
    }
    .login-card h1 {
      font-size: 20px;
      margin: 0 0 20px 0;
      text-align: center;
    }
    .login-card input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 5px;
      border: 1px solid #c1c1c1;
      font-size: 16px;
    }
    .login-card button {
      width: 100%;
      padding: 10px;
      background: #619e51;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .login-card button:hover {
      background: #4a793e;
    }
    .login-error {
      color: #d10000;
      font-size: 12px;
      margin-bottom: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>Dave's Odds — Admin</h1>
    {% if error %}
      <div class="login-error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <input type="text" name="username" placeholder="Username" autocomplete="username" required />
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Log In</button>
    </form>
  </div>
</body>
</html>
