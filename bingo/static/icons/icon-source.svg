<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed background (no rounding — the OS applies its own mask) -->
  <rect width="512" height="512" fill="#6b1f2a"/>

  <!-- 3x3 bingo grid, kept within the maskable safe zone (centered ~66% of canvas) -->
  <!-- Row 1 -->
  <rect x="137" y="137" width="70" height="70" rx="14" fill="#f6ead8"/>
  <rect x="221" y="137" width="70" height="70" rx="14" fill="#f6ead8"/>
  <rect x="305" y="137" width="70" height="70" rx="14" fill="#f6ead8"/>
  <!-- Row 2 -->
  <rect x="137" y="221" width="70" height="70" rx="14" fill="#f6ead8"/>
  <!-- Center cell — marked -->
  <rect x="221" y="221" width="70" height="70" rx="14" fill="#2f4a3c"/>
  <circle cx="256" cy="256" r="20" fill="#f6ead8"/>
  <rect x="305" y="221" width="70" height="70" rx="14" fill="#f6ead8"/>
  <!-- Row 3 -->
  <rect x="137" y="305" width="70" height="70" rx="14" fill="#f6ead8"/>
  <rect x="221" y="305" width="70" height="70" rx="14" fill="#f6ead8"/>
  <rect x="305" y="305" width="70" height="70" rx="14" fill="#f6ead8"/>
</svg>
